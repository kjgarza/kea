<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" role="img" aria-labelledby="t">
  <title id="t">Receipt from Silverline Engraving, Friday 16:40</title>
  <rect width="240" height="320" fill="#fdfaf2"/>
  <rect x="8" y="8" width="224" height="304" fill="none" stroke="#c9bfa8" stroke-dasharray="4 3"/>
  <g font-family="monospace" fill="#2b2b2b" font-size="12">
    <text x="120" y="40" text-anchor="middle" font-size="15" font-weight="bold">SILVERLINE ENGRAVING</text>
    <text x="120" y="58" text-anchor="middle">12 Mill Lane</text>
    <text x="24" y="92">Date: Fri 16:40</text>
    <text x="24" y="110">Customer: L. Brandt</text>
    <text x="24" y="146">1 x cup trophy</text>
    <text x="24" y="164">Engrave: "Champions 2026"</text>
    <text x="24" y="200">Paid (cash)      EUR 18.00</text>
    <text x="24" y="236">Ready for pickup: Monday</text>
    <text x="120" y="290" text-anchor="middle" font-size="10">Thank you!</text>
  </g>
</svg>
