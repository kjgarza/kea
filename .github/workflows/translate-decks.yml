name: Translate Decks to Spanish

on:
  workflow_dispatch:
    inputs:
      deck:
        description: 'Specific deck ID to translate (leave empty for all English decks)'
        required: false
        type: string
      force:
        description: 'Re-translate even if Spanish version already exists'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no API calls, no file writes)'
        required: false
        type: boolean
        default: false

jobs:
  translate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Translate decks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.deck }}" ]; then
            ARGS+=(--deck "${{ inputs.deck }}")
          else
            ARGS+=(--all)
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "Running: bun scripts/translate-decks.ts ${ARGS[*]}"
          bun scripts/translate-decks.ts "${ARGS[@]}"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/decks/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/decks/
          git commit -m "chore: add Spanish deck translations [skip ci]"
          git push
