name: Import Just One Deck

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'Path to the word list text file (relative to repo root)'
        required: false
        default: 'justone'
        type: string

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Import deck
        run: bun scripts/import-justone-text.ts --file "${{ inputs.source_file }}"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/decks/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/decks/
          git commit -m "chore: import classic just one deck [skip ci]"
          git push
