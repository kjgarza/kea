name: Import Monikers Deck

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Source JSON URL to import (leave empty for default)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        type: boolean
        default: false

  # Monthly schedule to pick up upstream changes
  schedule:
    - cron: '0 0 1 * *'

jobs:
  import:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Import Monikers deck
        run: |
          ARGS=""
          if [ -n "${{ inputs.source_url }}" ]; then
            ARGS="--url ${{ inputs.source_url }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          bun scripts/import-monikers-deck.ts $ARGS

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet public/decks/ || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/decks/
          git commit -m "chore: import community monikers decks [skip ci]"
          git push
