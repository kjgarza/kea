  </g>
  <rect x="300" y="186" width="40" height="8" fill="#33415c"/>
  <text x="300" y="214" font-family="Arial, sans-serif" font-size="10" fill="#1f2a44" text-anchor="middle">Staff door</text>
  <rect x="250" y="226" width="96" height="44" fill="none" stroke="#33415c" stroke-dasharray="5 3"/>
  <text x="298" y="252" font-family="Arial, sans-serif" font-size="10" fill="#1f2a44" text-anchor="middle">Staff car park</text>
  <rect x="100" y="258" width="60" height="6" fill="#33415c"/>
  <text x="130" y="282" font-family="Arial, sans-serif" font-size="10" fill="#1f2a44" text-anchor="middle">Main entrance</text>
  <g transform="translate(40 244)">
    <rect x="-8" y="-6" width="16" height="10" rx="2" fill="#d94a4a"/>
    <path d="M8 -1 L16 -6 L16 4 Z" fill="#d94a4a"/>
  </g>
  <text x="20" y="294" font-family="Arial, sans-serif" font-size="9" fill="#b02f2f">Camera: main entrance and front desk only</text>
