<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="t">
  <title id="t">Floor plan of the Saltmarsh Bay Maritime Museum</title>
  <rect width="360" height="300" fill="#f7f5ef"/>
  <g fill="#ffffff" stroke="#33415c" stroke-width="2">
    <rect x="20" y="20" width="110" height="90"/>
    <rect x="130" y="20" width="110" height="90"/>
    <rect x="240" y="20" width="100" height="90" fill="#fde9c9"/>
    <rect x="20" y="110" width="110" height="80"/>
    <rect x="130" y="110" width="110" height="80"/>
    <rect x="240" y="110" width="100" height="80" fill="#e4eef9"/>
    <rect x="20" y="190" width="220" height="70"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#1f2a44" text-anchor="middle">
    <text x="75" y="60">Gallery 1</text>
    <text x="185" y="60">Gallery 2</text>
    <text x="290" y="56" font-weight="bold">Gallery 3</text>
    <text x="290" y="72" font-size="9">Halden chronometer</text>
    <text x="75" y="150">Education Room</text>
    <text x="75" y="164" font-size="9">touch table</text>
    <text x="185" y="150">Curator's office</text>
    <text x="185" y="164" font-size="9">key box</text>
    <text x="290" y="146" font-weight="bold">Loading dock</text>
    <text x="290" y="162" font-size="9">roller door</text>
    <text x="80" y="226">Front desk</text>
